<div id="order-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" onclick="closeOrderModal()"></div>

    <div class="modal-content modal-content-wide" role="dialog" aria-modal="true" aria-labelledby="order-modal-title">
        <div class="modal-header order-modal-header">
            <div>
                <h2 id="order-modal-title">Order Details</h2>
                <p id="order-modal-subtitle" class="modal-subtitle"></p>
            </div>

            <button type="button" onclick="closeOrderModal()">Close</button>
        </div>

        <div id="order-modal-body" class="modal-body"></div>
    </div>
</div>
