<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WorkBot Admin</title>
    <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
    <header>
        <h1>WorkBot Admin</h1>
        <p>Manual tools for items, stores, vendors, and orders.</p>
    </header>

    <nav>
        <button data-panel="items-panel">Items</button>
        <button data-panel="stores-panel">Stores</button>
        <button data-panel="vendors-panel">Vendors</button>
        <button data-panel="orders-panel">Orders</button>
    </nav>

    <main>
        <section id="items-panel" class="panel active">
            <h2>Items</h2>

            <form id="item-form">
                <input name="name" placeholder="Name" required />
                <input name="category" placeholder="Category" />
                <input name="subcategory" placeholder="Subcategory" />

                <input name="count_unit_quantity" placeholder="Count quantity" />
                <input name="count_unit_measure" placeholder="Count measure" />

                <input name="custom_each_name" placeholder="Custom each name" />

                <input name="each_quantity" placeholder="Each quantity" />
                <input name="each_measure" placeholder="Each measure" />

                <input name="weight_quantity" placeholder="Weight quantity" />
                <input name="weight_measure" placeholder="Weight measure" />

                <input name="volume_quantity" placeholder="Volume quantity" />
                <input name="volume_measure" placeholder="Volume measure" />

                <label>
                    <input type="checkbox" name="is_active" checked />
                    Active
                </label>

                <button type="submit">Create Item</button>
            </form>

            <button id="refresh-items">Refresh Items</button>
            <div id="items-list" class="list"></div>
        </section>

        <section id="stores-panel" class="panel">
            <h2>Stores</h2>

            <form id="store-form">
                <input name="name" placeholder="Name" required />
                <input name="general_manager" placeholder="General manager" />
                <input name="inventory_clerk" placeholder="Inventory clerk" />
                <input name="address" placeholder="Address" />
                <input name="phone_number" placeholder="Phone number" />
                <textarea name="special_notes" placeholder="Special notes"></textarea>

                <label>
                    <input type="checkbox" name="is_active" checked />
                    Active
                </label>

                <button type="submit">Create Store</button>
            </form>

            <button id="refresh-stores">Refresh Stores</button>
            <div id="stores-list" class="list"></div>
        </section>

        <section id="vendors-panel" class="panel">
            <h2>Vendors</h2>

            <form id="vendor-form">
                <input name="name" placeholder="Name" required />
                <input name="order_format" placeholder="Order format" />
                <textarea name="special_notes" placeholder="Special notes"></textarea>

                <input name="min_order_value" placeholder="Minimum order value" />
                <input name="min_order_cases" placeholder="Minimum order cases" />

                <input name="ordering_email" placeholder="Ordering email" />
                <input name="ordering_phone_number" placeholder="Ordering phone number" />
                <input name="ordering_portal_url" placeholder="Ordering portal URL" />

                <label>
                    <input type="checkbox" name="is_active" checked />
                    Active
                </label>

                <button type="submit">Create Vendor</button>
            </form>

            <button id="refresh-vendors">Refresh Vendors</button>
            <div id="vendors-list" class="list"></div>
        </section>

        <section id="orders-panel" class="panel">
            <h2>Orders</h2>

            <form id="order-form">
                <label>
                    Store
                    <select name="store_id" id="order-store-select" required>
                        <option value="">Select a store...</option>
                    </select>
                </label>

                <label>
                    Vendor
                    <select name="vendor_id" id="order-vendor-select" required>
                        <option value="">Select a vendor...</option>
                    </select>
                </label>
                <label>
                    Order Date
                    <input name="order_date" id="order-date-input" type="date" required />
                </label>

                <label>
                    Delivery Date
                    <input name="delivery_date" id="delivery-date-input" type="date" />
                </label>
                <textarea name="notes" placeholder="Notes"></textarea>

                <h3>Line 1</h3>
                <input name="line_source_item_name" placeholder="Source item name" required />
                <input name="line_source_vendor_sku" placeholder="Source vendor SKU" />
                <input name="line_quantity" placeholder="Quantity" required />
                <input name="line_unit" placeholder="Unit" />
                <textarea name="line_notes" placeholder="Line notes"></textarea>

                <button type="submit">Create Order</button>
            </form>

            <button id="refresh-orders">Refresh Orders</button>
            <div id="orders-list" class="list"></div>
        </section>
    </main>

    <div id="message"></div>

    <div id="vendor-modal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" onclick="closeVendorModal()"></div>

        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="vendor-modal-title">
            <div class="modal-header">
                <h2 id="vendor-modal-title">Vendor Details</h2>
                <button type="button" onclick="closeVendorModal()">Close</button>
            </div>

            <div id="vendor-modal-body" class="modal-body"></div>
        </div>
    </div>

    <script src="/admin/api.js"></script>
    <script src="/admin/items.js"></script>
    <script src="/admin/stores.js"></script>
    <script src="/admin/vendors.js"></script>
    <script src="/admin/orders.js"></script>
</body>
</html>
