<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WorkBot Admin</title>
    <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
    <header>
        <h1>WorkBot Admin</h1>
        <p>Manual tools for items, stores, vendors, and orders.</p>
    </header>

    <nav>
        <button id="nav-items" data-panel="items-panel">Items</button>
        <button id="nav-stores" data-panel="stores-panel">Stores</button>
        <button id="nav-vendors" data-panel="vendors-panel">Vendors</button>
        <button id="nav-orders" data-panel="orders-panel">Orders</button>
    </nav>

    <div class="scope-bar">
        <label>
            Role / Store View
            <select id="store-scope-select">
                <option value="">Supervisor</option>
            </select>
        </label>
    </div>

    <main id="admin-sections"></main>

    <div id="message"></div>

    <div id="admin-modals"></div>

    <script src="/admin/shared/api.js"></script>
    <script src="/admin/shared/ui.js"></script>
    <script src="/admin/shared/partials.js"></script>
    <script src="/admin/shared/scope.js"></script>

    <script src="/admin/domains/items/items.js"></script>
    <script src="/admin/domains/stores/stores.js"></script>
    <script src="/admin/domains/vendors/vendors.js"></script>
    <script src="/admin/domains/orders/orders.js"></script>

    <script src="/admin/app.js"></script>
</body>
</html>
