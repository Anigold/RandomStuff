[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workbot"
version = "0.1.0"
description = "WorkBot operations automation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "openpyxl",
    "selenium",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
workbot = "apps.cli.main:main"
workbot-api = "apps.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "workbot_core*",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true